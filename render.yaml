services:
  - type: web
    name: afiya-clinic
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString
      - key: SEED_DEMO_PASSWORD
        value: demo1234
      - key: AI_PROVIDER
        value: mock
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

databases:
  - name: clinic-db
    databaseName: clinic_db
    user: clinic_admin
    plan: free
